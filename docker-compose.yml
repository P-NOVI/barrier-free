# 개발용 PostgreSQL. 저장소 루트에서 `docker compose up -d` 로 켠다.
# 비밀번호는 같은 폴더의 .env(POSTGRES_PASSWORD)에서 읽는다.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: barrierfree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?루트 .env 에 POSTGRES_PASSWORD 를 넣어 주세요}
      POSTGRES_DB: barrierfree
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barrierfree -d barrierfree"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

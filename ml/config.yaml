# 경로 기준
# - interim/… : 데이터 폴더 (ml/.env 의 DATA_DIR, 없으면 저장소 data/). pipeline 과 같은 폴더다.
# - models/… : 저장소 루트

data:
  # pipeline 13 단계 결과. 타깃 foot_traffic 은 센서를 지나간 사람 수(명/시간)다.
  training_set: interim/training/hourly.parquet
  # pipeline 12 단계 날짜별 달력. 쉬는 날 전날·다음날 피처를 만든다.
  calendar: interim/calendar/daily.parquet
  model_dir: models
  model_file: foot_traffic_model.txt
  meta_file: foot_traffic_meta.json
  eval_file: foot_traffic_eval.json

# 슬롯 시작 시각(slot_start) 기준. 학습은 valid_start 전, 검증(조기 종료용)은 valid_start ~
# test_start 전, 테스트는 test_start ~ test_end(그날 포함)다.
split:
  valid_start: "2026-06-01"
  test_start: "2026-08-01"
  test_end: "2026-10-25"

features:
  # 서비스에서는 예보를 넣으므로 실측 그대로 쓰지 않고 구간으로 줄인다.
  temp_bin_c: 5
  # 강수 등급: 0 이하 → 0, (0,1] → 1, (1,5] → 2, (5,20] → 3, 20 초과 → 4 (mm)
  rain_bins_mm: [0, 1, 5, 20]
  groups:
    base: [sensor_code, district, lon, lat, day_of_week, hour_of_day]
    weather: [temp_bin, rain_grade]
    holiday:
      - is_holiday
      - is_off_day
      - off_run_length
      - in_long_holiday
      - days_to_long_holiday
      - days_since_long_holiday
    # 쉬는 날(공휴일·주말) 기준. 전날은 금요일·연휴 전날·공휴일 전날을, 다음날은 월요일·
    # 연휴 다음날·공휴일 다음날을 묶는다.
    off_adjacent: [is_before_off_day, is_after_off_day]
    # 센서의 최근 수준(recent_level 절). 단절이나 계절로 수준이 변하는 센서를 따라간다.
    recent_level: [level_same_hour, level_same_dow_hour]
  categorical: [sensor_code, district]

# 센서의 최근 수준 피처. 예측하려는 날의 gap_days 일 전까지의 데이터만 쓴다(서비스에서
# 센서 데이터가 늦게 들어오는 것을 가정한다). 표본이 min_samples 미만이면 비운다.
recent_level:
  gap_days: 7
  # 같은 시각(요일 무관) 최근 same_hour_days 일 평균
  same_hour_days: 28
  min_samples_hour: 5
  # 같은 요일·시각 최근 same_dow_weeks 주 평균
  same_dow_weeks: 8
  min_samples_dow: 2

# 타깃. ratio 는 사람 수를 센서의 최근 수준으로 나눈 비율을 맞추고, 예측값은 비율 × 최근
# 수준(명/시간)이다. 최근 수준은 recent_level 의 같은 요일·시각 평균, 없으면 같은 시각
# 평균, 그래도 없으면 센서·요일·시각 중앙값이다. absolute 는 사람 수를 그대로 맞춘다.
target:
  mode: ratio
  # 최근 수준이 이보다 작으면 이 값으로 본다(0 으로 나누지 않는다).
  floor: 1.0
  # ref: 최근 수준만큼 가중해 사람 수 오차(MAE)를 그대로 줄인다. none: 모든 행을 같게
  # 가중해 작은 센서도 같은 비중으로 본다.
  weight: ref
  # weight 가 ref 일 때 가중치 = 기준값 ** weight_power. 1 이면 사람 수 MAE 를 그대로 줄이고,
  # 1 보다 크면 유동인구가 큰 행을 더 중시한다(작은 센서는 덜 맞춘다).
  weight_power: 1.0

model:
  # 목적함수를 비교해 검증 구간 MAE 가 가장 낮은 것을 최종 모델로 쓴다.
  # poisson 은 사람 수 같은 개수 데이터용이다.
  objectives: [regression_l1, regression_l2, poisson]
  num_boost_round: 3000
  early_stopping_rounds: 100
  seed: 42
  params:
    learning_rate: 0.05
    num_leaves: 127
    min_data_in_leaf: 200
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    verbosity: -1

# 평가 보고서에 남기는 센서별 오차(사람 수 기준, 오차율 기준 각각)의 상위(나쁜 쪽) 개수
report:
  worst_sensors: 10
  # 실제 유동인구 크기별 오차 구간 경계(명/시간). 마지막 경계 이상은 한 구간이다.
  level_bins: [0, 100, 500, 1000, 2000]
  # 실제 값이 상위 (1 - top_quantile) 비율인 행의 오차와 편향을 따로 본다.
  top_quantile: 0.95

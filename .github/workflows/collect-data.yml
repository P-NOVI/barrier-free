# 10분마다 유동인구·날씨를 받아 수집 DB(Supabase)에 쌓는다. backend/app/collector 참고.
# 날씨는 DB에 없는 시각만 받으므로 대부분의 실행은 유동인구만 새로 넣는다.
# 수집 전에 dev 의 수집 DB 마이그레이션(backend/migrations/collector)을 적용한다.
# 공용 수집 DB의 테이블은 이 워크플로만 바꾼다.
# Actions 실행기는 IPv6 를 못 써서 Supabase 는 Session pooler 주소(IPv4)를 쓴다.
# 예약 실행은 기본 브랜치(main)에 있는 이 파일로만 돈다. 코드는 dev 에서 받는다.
# 필요한 저장소 Secrets: COLLECTOR_DATABASE_URL, SDOT_API_KEY, KMA_API_KEY
name: Collect Data

on:
  schedule:
    # 매시 7·17·27·37·47·57분. 정각은 GitHub 예약 실행이 몰려 늦어지기 쉽다.
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: astral-sh/setup-uv@v6
      - name: 수집 DB 마이그레이션
        run: uv run --frozen --no-dev python -m app.migrate collector
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
      - name: 수집
        run: uv run --frozen --no-dev python -m app.collector
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
          SDOT_API_KEY: ${{ secrets.SDOT_API_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}

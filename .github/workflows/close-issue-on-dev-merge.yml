name: Close Issue On Dev Merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: PR 본문의 Closes #번호 이슈 닫기
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = new Set(
              [...(pr.body ?? '').matchAll(pattern)].map((m) => Number(m[1]))
            );
            for (const issue_number of numbers) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: `PR #${pr.number} 이(가) dev에 머지되어 이슈를 닫습니다.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
